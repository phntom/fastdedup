name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Use exactly the toolchain setup-go installed; never auto-download another one.
  GOTOOLCHAIN: local

jobs:
  test:
    name: Test (Go ${{ matrix.go-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # 1.26.x is the minimum declared in go.mod; stable is the latest release.
        go-version:
          - "1.26.x"
          - "stable"
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go-version }}
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -race -count=1 ./...
      - name: Check formatting
        if: matrix.go-version == 'stable'
        run: |
          set -euo pipefail
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "Files not gofmt-formatted:"
            echo "$unformatted"
            exit 1
          fi
      - name: Check modules are tidy
        if: matrix.go-version == 'stable'
        run: |
          set -euo pipefail
          if ! diff=$(go mod tidy -diff); then
            echo "go mod tidy -diff failed (reports a difference or an error):"
            echo "$diff"
            exit 1
          fi
          if [ -n "$diff" ]; then
            echo "go mod tidy -diff reports a difference:"
            echo "$diff"
            exit 1
          fi

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: stable
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0

  cross-build:
    name: Cross-build (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: linux
            goarch: "386"
          - goos: linux
            goarch: arm
          - goos: linux
            goarch: riscv64
          - goos: linux
            goarch: ppc64le
          - goos: linux
            goarch: s390x
          - goos: linux
            goarch: mips64le
          - goos: darwin
            goarch: arm64
          - goos: freebsd
            goarch: amd64
          - goos: windows
            goarch: amd64
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: stable
      - name: Build
        run: go build ./...
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
      - name: Vet
        run: go vet ./...
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}

  shellcheck:
    name: Shellcheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Run shellcheck
        run: shellcheck release.sh debian/fastdedup-cron

  e2e-reflink:
    name: E2E reflink (${{ matrix.fs }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        fs:
          - btrfs
          - xfs
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: stable
      - name: Install filesystem tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y btrfs-progs xfsprogs
      - name: Create and mount filesystem image
        run: |
          set -euo pipefail
          img="${RUNNER_TEMP}/e2e-${FS}.img"
          mnt="${RUNNER_TEMP}/e2e-${FS}"
          truncate -s 1G "$img"
          mkdir -p "$mnt"
          if [ "$FS" = "btrfs" ]; then
            mkfs.btrfs -q "$img"
          else
            mkfs.xfs -q -m reflink=1 "$img"
          fi
          sudo mount -o loop "$img" "$mnt"
          sudo chown "$(id -un):$(id -gn)" "$mnt"
        env:
          FS: ${{ matrix.fs }}
      - name: Run E2E tests
        run: go test -count=1 -v -run '^TestE2E' .
        env:
          FASTDEDUP_E2E_DIR: ${{ runner.temp }}/e2e-${{ matrix.fs }}
          FASTDEDUP_E2E_REQUIRE_REFLINK: "1"
      - name: Unmount filesystem image
        if: always()
        run: |
          set -euo pipefail
          sudo umount "${RUNNER_TEMP}/e2e-${FS}" || true
        env:
          FS: ${{ matrix.fs }}
